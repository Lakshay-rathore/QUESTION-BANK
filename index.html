<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Question Bank</title>

<style>

body{
    font-family: Arial, sans-serif;
    background-color: #e8ecf1;
    text-align: center;
    padding-top: 50px;
}

h1{
    color: #14532d;
    font-size: 48px;
    margin-bottom: 10px;
}

p{
    color: #555;
    margin-bottom: 40px;
}

.subject{
    display: block;
    width: 300px;
    margin: 15px auto;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background-color: white;
    box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
    cursor: pointer;
    font-size: 18px;
}

.subject:hover{
    background-color: #334155;
    color: white;
}


</style>
</head>

<body>

<h1>Question Bank</h1>

<p>Select a Subject</p>

<button class="subject">Physics</button>

<button class="subject">Chemistry</button>

<button class="subject">Biology</button>

<button class="subject">Combined</button>


</body>
</html>
